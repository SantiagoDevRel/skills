name: Verify Arkiv plugin

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - 'hooks/**'
      - 'source/**'
      - 'templates/**'
      - '.github/workflows/**'
      - '.claude-plugin/**'
      - '.agents/plugins/**'
      - '.cursor-plugin/**'
      - 'cursor/**'
      - '*plugin*.json'
      - '*mcp*.json'
      - 'README.md'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set verification evidence directory
        shell: bash
        run: printf 'ARKIV_HEALTH_DIRECTORY=%s/arkiv-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/snippets/package-lock.json
      - run: npm ci --prefix tests/snippets --ignore-scripts --no-audit --no-fund
      - run: node --test tests/snippets/sdk-compatibility.test.mjs
      - name: Enforce the published SDK supported range
        run: node scripts/check-sdk-compatibility.mjs "$ARKIV_HEALTH_DIRECTORY/sdk-compatibility.json"
      - run: node --test tests/snippets/infrastructure.test.mjs
      - run: node --test tests/snippets/mcp.test.mjs
      - run: node --test tests/snippets/rpc.test.mjs
      - run: node --test tests/snippets/eval-evidence.test.mjs
      - run: node --test tests/live/live.test.mjs
      - run: node scripts/check-evals.mjs
      - run: npm exec --yes --package=@anthropic-ai/claude-code@2.1.291 -- claude plugin validate --strict .
      - run: node scripts/run-local-checks.mjs --output "$ARKIV_HEALTH_DIRECTORY"
      - name: Record anonymous network identity and head separately
        if: always()
        run: node scripts/check-rpc.mjs "$ARKIV_HEALTH_DIRECTORY/network.json"
      - name: Check exact upstream feedback field labels
        if: always()
        run: node scripts/check-feedback-forms.mjs "$ARKIV_HEALTH_DIRECTORY/static.json"
      - name: Preserve actual verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arkiv-local-evidence
          path: ${{ runner.temp }}/arkiv-evidence/
          if-no-files-found: warn
